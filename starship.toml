"$schema" = "https://starship.rs/config-schema.json"

# ============================================================
# STARSHIP CONFIGURATION (GENERATED BY NEXA / MATUGEN)
# Dynamic Matugen Theme • Two-line Powerline prompt
# ============================================================

add_newline = true
palette = "nexa"

format = """
${custom.prompt_path}$git_branch$git_status$fill$time
$character"""

[palettes.nexa]
text   = "#f4dde5"
muted  = "#9f8c93"
crust  = "#160b10"
surface = "#1c1016"
surface_container = "#291c22"
surface_container_high = "#34262c"
primary = "#ffafd6"
on_primary = "#620043"
primary_container = "#8a0060"
on_primary_container = "#ffd8e8"
secondary = "#f0b7c5"
on_secondary = "#4a2530"
secondary_container = "#643b46"
on_secondary_container = "#ffd9e1"
tertiary = "#ffb3b6"
on_tertiary = "#532025"
tertiary_container = "#6e353a"
on_tertiary_container = "#ffdada"
success = "#78e29c"
on_success = "#083617"
warning = "#efc36c"
on_warning = "#372706"
error = "#f0757f"
on_error = "#37060a"
info = "#79cfec"
on_info = "#062b37"
outline = "#9f8c93"
neon = "#ffafd6"
moss = "#78e29c"
amber = "#efc36c"
rose = "#f0757f"
denim = "#79cfec"

# ============================================================
# FIRST LINE: UNIFIED USER, HOST, AND RAINBOW PATH
# ============================================================

[username]
disabled = true

[hostname]
disabled = true

[custom.prompt_path]
when = true
shell = ["bash", "--noprofile", "--norc"]
format = "$output"
unsafe_no_escape = true

command = '''
user="${USER:-$(id -un)}"
host="${HOSTNAME:-$(hostname -s 2>/dev/null || uname -n)}"
path="$PWD"

parts=()
if [[ "$path" == "$HOME" ]]; then
  parts=("")
elif [[ "$path" == "$HOME/"* ]]; then
  relative_path="${path#$HOME/}"
  IFS='/' read -r -a remaining_parts <<< "$relative_path"
  parts=("" "${remaining_parts[@]}")
elif [[ "$path" == "/" ]]; then
  parts=("/")
else
  relative_path="${path#/}"
  IFS='/' read -r -a remaining_parts <<< "$relative_path"
  parts=("/" "${remaining_parts[@]}")
fi

to_rgb() {
  local v="${1//,/;}"
  echo "${v// /;}"
}

bracket_fg=$(to_rgb "159,140,147")
user_bg=$(to_rgb "255,175,214")
user_fg=$(to_rgb "98,0,67")

bg_colors=(
  $(to_rgb "240,183,197")
  $(to_rgb "255,179,182")
  $(to_rgb "121,207,236")
  $(to_rgb "120,226,156")
  $(to_rgb "239,195,108")
  $(to_rgb "100,59,70")
  $(to_rgb "110,53,58")
)

fg_colors=(
  $(to_rgb "74,37,48")
  $(to_rgb "83,32,37")
  $(to_rgb "6,43,55")
  $(to_rgb "8,54,23")
  $(to_rgb "55,39,6")
  $(to_rgb "255,217,225")
  $(to_rgb "255,218,218")
)

color_count=${#bg_colors[@]}
part_count=${#parts[@]}

# 1. Bracket
printf '\033[1;38;2;%sm╭─\033[0m' "$bracket_fg"

# 2. Filled user@host segment
printf '\033[1;38;2;%sm\033[48;2;%sm  %s@%s in ' "$user_fg" "$user_bg" "$user" "$host"

# 3. First path color & powerline transition
first_bg="${bg_colors[0]}"
printf '\033[38;2;%sm\033[48;2;%sm' "$user_bg" "$first_bg"

# 4. Path segments
for ((i = 0; i < part_count; i++)); do
  bg="${bg_colors[$((i % color_count))]}"
  fg="${fg_colors[$((i % color_count))]}"

  printf '\033[1;38;2;%sm\033[48;2;%sm %s ' "$fg" "$bg" "${parts[i]}"

  if ((i < part_count - 1)); then
    next_bg="${bg_colors[$(((i + 1) % color_count))]}"
    printf '\033[38;2;%sm\033[48;2;%sm' "$bg" "$next_bg"
  else
    printf '\033[38;2;%sm\033[49m\033[0m ' "$bg"
  fi
done

printf '\033[0m'
'''

[git_branch]
symbol = " "
style = "bold success"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold warning"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead = "󰜷${count} "
behind = "󰜮${count} "
diverged = "󰹺 ${ahead_count}${behind_count} "
untracked = "? "
stashed = "󰓼 "
modified = "! "
staged = "+${count} "
renamed = "󰑕 "
deleted = "󰆴 "

# ============================================================
# SECOND LINE: PROMPT CHARACTER
# ============================================================

[character]
format = "$symbol"
success_symbol = "[╰─](bold muted)[❯](bold primary) "
error_symbol = "[╰─](bold muted)[❯](bold error) "
vimcmd_symbol = "[╰─](bold muted)[❮](bold warning) "

# ============================================================
# DIRECTORY
# The built-in directory is disabled because custom.prompt_path
# renders the complete path.
# ============================================================

[directory]
disabled = true
style = "bold denim"
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"~/Documents" = "󰈙 "
"~/Downloads" = " "
"~" = "󰋞 "

# ============================================================
# OPTIONAL MODULE SETTINGS
# ============================================================

[git_metrics]
disabled = false
added_style = "bold success"
deleted_style = "bold error"
format = "[+$added]($added_style)/[-$deleted]($deleted_style) "

[sudo]
disabled = false
style = "bold error"

[nix_shell]
format = "via [$symbol(($name))]($style) "
symbol = " "
style = "bold info"

[cmd_duration]
disabled = false
style = "bold warning"
format = " took [$duration]($style)"
show_milliseconds = true
show_notifications = true
min_time_to_notify = 30000

[battery]
charging_symbol = ""
disabled = true
discharging_symbol = ""
full_symbol = ""

[[battery.display]]
disabled = false
style = "bold error"
threshold = 15

[[battery.display]]
disabled = true
style = "bold warning"
threshold = 50

[[battery.display]]
disabled = true
style = "bold success"
threshold = 90

[status]
disabled = false
format = '[\[$symbol$common_meaning$signal_name$maybe_int\]]($style) '
style = "bold error"
map_symbol = true
pipestatus = true
symbol = "✖"
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = "󰟾"
signal_symbol = ""

[os]
disabled = false
format = " [$symbol]($style)"
style = "bold info"

[fill]
symbol = " "
style = "muted"

