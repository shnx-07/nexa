# Generated by NEXA Power & Sleep Management
# Do not edit manually. Changes will be overwritten by NEXA Settings.

general {
    lock_cmd = /home/shnx/.config/nexa/rust/target/release/nexad lock trigger
    before_sleep_cmd = /home/shnx/.config/nexa/rust/target/release/nexad lock trigger
    after_sleep_cmd = hyprctl dispatch dpms on

    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 120
    on-timeout = /home/shnx/.config/nexa/rust/target/release/nexad lock trigger
}

listener {
    timeout = 40
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 60
    on-timeout = brightnessctl -s set 0
    on-resume = brightnessctl -r && hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
