[config]

# One canonical renderer for every theme source.
# Presets and wallpaper-generated themes must both arrive here as canonical JSON.

[templates.nexa_palette]
input_path = "~/.config/matugen/templates/nexa-palette"
output_path = "~/.cache/nexa/theme/palette"

[templates.nexa]
input_path = "~/.config/matugen/templates/nexa-preset.qml"
output_path = "~/.config/nexa/quickshell/theme/MatugenColors.qml"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-preset.conf"
output_path = "~/.config/kitty/nexa-theme.conf"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-preset.css"
output_path = "~/.config/gtk-3.0/nexa-colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-preset.css"
output_path = "~/.config/gtk-4.0/nexa-colors.css"

[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct-preset.conf"
output_path = "~/.config/qt6ct/colors/nexa.conf"

[templates.kde]
input_path = "~/.config/matugen/templates/kde-preset.colors"
output_path = "~/.local/share/color-schemes/Nexa.colors"

[templates.btop]
input_path = "~/.config/matugen/templates/btop-preset.theme"
output_path = "~/.config/btop/themes/nexa.theme"

[templates.htop]
input_path = "~/.config/matugen/templates/htop-preset.rc"
output_path = "~/.config/htop/htoprc"
