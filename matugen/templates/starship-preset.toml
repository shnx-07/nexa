"$schema" = "https://starship.rs/config-schema.json"

# ============================================================
# STARSHIP CONFIGURATION (GENERATED BY NEXA / MATUGEN)
# Dynamic Matugen Theme • Two-line Powerline prompt
# ============================================================

add_newline = true
palette = "nexa"

format = """
${custom.prompt_path}$git_branch$git_status$fill$time
$character"""

[palettes.nexa]
text   = "{{colors.on_background}}"
muted  = "{{colors.outline}}"
crust  = "{{colors.surface_container_lowest}}"
surface = "{{colors.surface}}"
surface_container = "{{colors.surface_container}}"
surface_container_high = "{{colors.surface_container_high}}"
primary = "{{colors.primary}}"
on_primary = "{{colors.on_primary}}"
primary_container = "{{colors.primary_container}}"
on_primary_container = "{{colors.on_primary_container}}"
secondary = "{{colors.secondary}}"
on_secondary = "{{colors.on_secondary}}"
secondary_container = "{{colors.secondary_container}}"
on_secondary_container = "{{colors.on_secondary_container}}"
tertiary = "{{colors.tertiary}}"
on_tertiary = "{{colors.on_tertiary}}"
tertiary_container = "{{colors.tertiary_container}}"
on_tertiary_container = "{{colors.on_tertiary_container}}"
success = "{{colors.success}}"
on_success = "{{colors.on_success}}"
warning = "{{colors.warning}}"
on_warning = "{{colors.on_warning}}"
error = "{{colors.error}}"
on_error = "{{colors.on_error}}"
info = "{{colors.info}}"
on_info = "{{colors.on_info}}"
outline = "{{colors.outline}}"
neon = "{{colors.primary}}"
moss = "{{colors.success}}"
amber = "{{colors.warning}}"
rose = "{{colors.error}}"
denim = "{{colors.info}}"

# ============================================================
# FIRST LINE: UNIFIED USER, HOST, AND RAINBOW PATH
# ============================================================

[username]
disabled = true

[hostname]
disabled = true

[custom.prompt_path]
when = true
shell = ["bash", "--noprofile", "--norc"]
format = "$output"
unsafe_no_escape = true

command = '''
user="${USER:-$(id -un)}"
host="${HOSTNAME:-$(hostname -s 2>/dev/null || uname -n)}"
path="$PWD"

parts=()
if [[ "$path" == "$HOME" ]]; then
  parts=("")
elif [[ "$path" == "$HOME/"* ]]; then
  relative_path="${path#$HOME/}"
  IFS='/' read -r -a remaining_parts <<< "$relative_path"
  parts=("" "${remaining_parts[@]}")
elif [[ "$path" == "/" ]]; then
  parts=("/")
else
  relative_path="${path#/}"
  IFS='/' read -r -a remaining_parts <<< "$relative_path"
  parts=("/" "${remaining_parts[@]}")
fi

to_rgb() {
  local v="${1//,/;}"
  echo "${v// /;}"
}

bracket_fg=$(to_rgb "{{rgb.outline}}")
user_bg=$(to_rgb "{{rgb.primary}}")
user_fg=$(to_rgb "{{rgb.on_primary}}")

bg_colors=(
  $(to_rgb "{{rgb.secondary}}")
  $(to_rgb "{{rgb.tertiary}}")
  $(to_rgb "{{rgb.info}}")
  $(to_rgb "{{rgb.success}}")
  $(to_rgb "{{rgb.warning}}")
  $(to_rgb "{{rgb.secondary_container}}")
  $(to_rgb "{{rgb.tertiary_container}}")
)

fg_colors=(
  $(to_rgb "{{rgb.on_secondary}}")
  $(to_rgb "{{rgb.on_tertiary}}")
  $(to_rgb "{{rgb.on_info}}")
  $(to_rgb "{{rgb.on_success}}")
  $(to_rgb "{{rgb.on_warning}}")
  $(to_rgb "{{rgb.on_secondary_container}}")
  $(to_rgb "{{rgb.on_tertiary_container}}")
)

color_count=${#bg_colors[@]}
part_count=${#parts[@]}

# 1. Bracket
printf '\033[1;38;2;%sm╭─\033[0m' "$bracket_fg"

# 2. Filled user@host segment
printf '\033[1;38;2;%sm\033[48;2;%sm  %s@%s in ' "$user_fg" "$user_bg" "$user" "$host"

# 3. First path color & powerline transition
first_bg="${bg_colors[0]}"
printf '\033[38;2;%sm\033[48;2;%sm' "$user_bg" "$first_bg"

# 4. Path segments
for ((i = 0; i < part_count; i++)); do
  bg="${bg_colors[$((i % color_count))]}"
  fg="${fg_colors[$((i % color_count))]}"

  printf '\033[1;38;2;%sm\033[48;2;%sm %s ' "$fg" "$bg" "${parts[i]}"

  if ((i < part_count - 1)); then
    next_bg="${bg_colors[$(((i + 1) % color_count))]}"
    printf '\033[38;2;%sm\033[48;2;%sm' "$bg" "$next_bg"
  else
    printf '\033[38;2;%sm\033[49m\033[0m ' "$bg"
  fi
done

printf '\033[0m'
'''

[git_branch]
symbol = " "
style = "bold success"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold warning"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead = "󰜷${count} "
behind = "󰜮${count} "
diverged = "󰹺 ${ahead_count}${behind_count} "
untracked = "? "
stashed = "󰓼 "
modified = "! "
staged = "+${count} "
renamed = "󰑕 "
deleted = "󰆴 "

# ============================================================
# SECOND LINE: PROMPT CHARACTER
# ============================================================

[character]
format = "$symbol"
success_symbol = "[╰─](bold muted)[❯](bold primary) "
error_symbol = "[╰─](bold muted)[❯](bold error) "
vimcmd_symbol = "[╰─](bold muted)[❮](bold warning) "

# ============================================================
# DIRECTORY
# The built-in directory is disabled because custom.prompt_path
# renders the complete path.
# ============================================================

[directory]
disabled = true
style = "bold denim"
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"~/Documents" = "󰈙 "
"~/Downloads" = " "
"~" = "󰋞 "

# ============================================================
# OPTIONAL MODULE SETTINGS
# ============================================================

[git_metrics]
disabled = false
added_style = "bold success"
deleted_style = "bold error"
format = "[+$added]($added_style)/[-$deleted]($deleted_style) "

[sudo]
disabled = false
style = "bold error"

[nix_shell]
format = "via [$symbol(($name))]($style) "
symbol = " "
style = "bold info"

[cmd_duration]
disabled = false
style = "bold warning"
format = " took [$duration]($style)"
show_milliseconds = true
show_notifications = true
min_time_to_notify = 30000

[battery]
charging_symbol = ""
disabled = true
discharging_symbol = ""
full_symbol = ""

[[battery.display]]
disabled = false
style = "bold error"
threshold = 15

[[battery.display]]
disabled = true
style = "bold warning"
threshold = 50

[[battery.display]]
disabled = true
style = "bold success"
threshold = 90

[status]
disabled = false
format = '[\[$symbol$common_meaning$signal_name$maybe_int\]]($style) '
style = "bold error"
map_symbol = true
pipestatus = true
symbol = "✖"
not_executable_symbol = ""
not_found_symbol = ""
sigint_symbol = "󰟾"
signal_symbol = ""

[os]
disabled = false
format = " [$symbol]($style)"
style = "bold info"

[fill]
symbol = " "
style = "muted"

