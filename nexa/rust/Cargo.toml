[package]
name = "nexad"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
pam = "0.8"

# HTTP / Weather backend
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Notification / D-Bus backend
zbus = "5"
async-io = "2"
futures-lite = "2"
