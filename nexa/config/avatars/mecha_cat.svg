<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="catbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="cateyes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#catbg)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1f2937" stroke-width="2"/>
  <!-- Cyber Ears -->
  <polygon points="50,90 40,42 90,65" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <polygon points="150,90 160,42 110,65" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <polygon points="54,82 48,50 82,68" fill="#10b981" opacity="0.8" filter="url(#emeraldGlow)"/>
  <polygon points="146,82 152,50 118,68" fill="#10b981" opacity="0.8" filter="url(#emeraldGlow)"/>
  <!-- Head Mask -->
  <polygon points="50,90 100,65 150,90 140,145 100,165 60,145" fill="#111827" stroke="#374151" stroke-width="3"/>
  <!-- Glowing Slit Eyes -->
  <ellipse cx="78" cy="105" rx="16" ry="7" fill="url(#cateyes)" transform="rotate(-8 78 105)" filter="url(#emeraldGlow)"/>
  <ellipse cx="122" cy="105" rx="16" ry="7" fill="url(#cateyes)" transform="rotate(8 122 105)" filter="url(#emeraldGlow)"/>
  <line x1="78" y1="100" x2="78" y2="110" stroke="#ffffff" stroke-width="2"/>
  <line x1="122" y1="100" x2="122" y2="110" stroke="#ffffff" stroke-width="2"/>
  <!-- Cyber Nose -->
  <polygon points="96,125 104,125 100,131" fill="#10b981"/>
</svg>