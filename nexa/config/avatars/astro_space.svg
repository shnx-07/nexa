<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="spacebg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="goldvisor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="goldglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#spacebg)"/>
  <!-- Stars -->
  <circle cx="35" cy="45" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="160" cy="35" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="170" cy="120" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="30" cy="140" r="1.5" fill="#ffffff" opacity="0.7"/>
  <!-- Helmet Outer -->
  <circle cx="100" cy="100" r="62" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="100" cy="100" r="58" fill="#f8fafc"/>
  <!-- Visor -->
  <rect x="58" y="70" width="84" height="60" rx="28" fill="url(#goldvisor)" filter="url(#goldglow)"/>
  <!-- Reflection Sheen -->
  <path d="M68 82 C85 75 115 75 132 82 C125 90 95 90 68 82 Z" fill="#ffffff" opacity="0.45"/>
  <!-- Chin Valve -->
  <rect x="90" y="142" width="20" height="8" rx="4" fill="#94a3b8"/>
</svg>