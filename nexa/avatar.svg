<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="visor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.6"/>
  <!-- Hood/Helmet Base -->
  <path d="M50 170 C40 140 50 80 100 65 C150 80 160 140 150 170 Z" fill="#1e293b"/>
  <!-- Face/Mask Plate -->
  <path d="M68 125 L100 155 L132 125 L125 95 L75 95 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Cyber Visor Glowing -->
  <rect x="62" y="98" width="76" height="20" rx="8" fill="url(#visor)" filter="url(#glow)"/>
  <line x1="72" y1="108" x2="128" y2="108" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <!-- Cyber Accents -->
  <circle cx="100" cy="138" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <line x1="88" y1="148" x2="112" y2="148" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
</svg>